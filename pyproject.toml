[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-export"
version = "0.1.0"
description = "APB2 results exported in the formats downstream tools read, msmu first"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "anndata>=0.11",
    "apb2>=0.1,<0.2",
    "apb-catalog>=0.1,<0.2",
    "apb-fasta>=0.1,<0.2",
    "cyclopts>=4,<5",
    "loguru>=0.7,<1",
    "mudata>=0.4.1,<0.5",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "polars>=1.43,<2",
    "pydantic>=2.10,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.142,<1",
    "python-multipart>=0.0.32,<1",
    "uvicorn>=0.54,<1",
]

[project.scripts]
apb-export = "apb_export.cli:main"
apb-export-web = "apb_export.web.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "fastapi>=0.142,<1",
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "python-multipart>=0.0.32,<1",
    "ruff==0.16.10",
    "twine>=6,<7",
    "uvicorn>=0.54,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# SciPy, pandas and AnnData still propagate Unknown through supported public operations.
# Keep strict first-party checking while suppressing diagnostics with only that signal.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apb_export"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_export"]
# consumers/ runs in the consumer image, where the tools it imports are installed.
extend_exclude = ["consumers"]

[tool.deptry.per_rule_ignores]
# FastAPI parses multipart uploads through python-multipart without our importing it.
DEP002 = ["python-multipart"]

[tool.uv.sources]
apb2 = { path = "../apb2", editable = true }
apb-catalog = { path = "../apb-catalog", editable = true }
apb-fasta = { path = "../apb-fasta", editable = true }
