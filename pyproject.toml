[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-msmu"
version = "0.1.0"
description = "One step from vendor output to msmu-ready MuData through APB2"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "anndata>=0.11",
    "apb2>=0.1,<0.2",
    "apb-catalog>=0.1,<0.2",
    "cyclopts>=4,<5",
    "loguru>=0.7,<1",
    "mudata>=0.4.1,<0.5",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "polars>=1.43,<2",
    "scipy>=1.15,<2",
]

[project.scripts]
apb-msmu = "apb_msmu.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]
# The parity tests run msmu's own reader against an export; msmu is heavy, so it is opt-in.
parity = [
    "msmu>=0.4,<0.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# SciPy, pandas and AnnData still propagate Unknown through supported public operations.
# Keep strict first-party checking while suppressing diagnostics with only that signal.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apb_msmu"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_msmu"]

[tool.uv.sources]
apb2 = { path = "../apb2", editable = true }
apb-catalog = { path = "../apb-catalog", editable = true }
