name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apb-export
    steps:
      - name: Check out APB Export
        uses: actions/checkout@v6
        with:
          path: apb-export

      - name: Check out compatible APB2
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb2
          ref: ce7d7369624472c6a4a1ce3ae014ff8b7e7bd665
          path: apb2

      - name: Check out compatible APB Catalog
        uses: actions/checkout@v6
        with:
          repository: anndata-omics-bridge/apb-catalog
          ref: e3ee07aab1ce094810b953e64578a2bea769a2f3
          path: apb-catalog

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize environment
        run: uv sync --frozen --group dev --group parity

      - name: Run quality gates
        run: make check
